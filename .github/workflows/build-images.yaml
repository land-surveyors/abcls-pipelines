# Build ABCLS container images from land-surveyors/abcls and push them to a
# container registry (ACR by default).
#
# Trigger: manual dispatch only (GitHub UI: Actions -> "Build and push images"
# -> "Run workflow", or `gh workflow run`).
#
# Inputs:
#   tag      (required) Image tag, e.g. 0.145.0. A leading 'v' before a digit
#                       is stripped automatically (v0.145.0 -> 0.145.0).
#   ref      (optional) Git ref of land-surveyors/abcls to build (branch, tag,
#                       or SHA). Empty (default) = that repo's default branch.
#   registry (optional) Target registry, e.g. abclsacr.azurecr.io.
#   images   (optional) Comma list from: client,api,data-migration.
#   overwrite (optional) 'true' to rebuild tags that already exist in the
#                       registry. Default: false (see step 2 below).
#
# Required secrets on THIS repo (abcls-pipelines -> Settings -> Secrets):
#   ABCLS_REPO_TOKEN   PAT with read access to land-surveyors/abcls
#                       (classic: `repo` scope; or fine-grained with
#                       Contents: Read on that repo). GITHUB_TOKEN cannot read
#                       across repos, hence this secret.
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#                       Service-principal credentials used as the ACR docker
#                       login (same convention/secret names as the abcls repo).
#   GOOGLE_MAPS_API_KEY / TINYMCE_API_KEY
#                       Baked into the client image as build args (same names
#                       as the abcls repo). The build fails if either is unset
#                       while `client` is selected.
#
# Example:
#   gh workflow run build-images.yaml -R land-surveyors/abcls-pipelines \
#     -f tag=0.145.0
#   gh workflow run build-images.yaml -R land-surveyors/abcls-pipelines \
#     -f tag=0.145.0 -f ref=v0.145.0 -f images=api
#
# What it does:
#   1. Resolves the source ref (explicit `ref`, else the abcls default branch).
#   2. Probes the registry and fails fast if ALL selected tags already exist
#      (probable accidental re-dispatch; set overwrite=true to force).
#      Unexpected probe errors also fail fast (fail-closed) rather than
#      passing silently as "tag missing".
#      Partial matches only warn and proceed (probable retry after a
#      partial push: the build script pushes sequentially and stops at
#      the first failure).
#   3. Checks out land-surveyors/abcls at that ref.
#   4. Runs its scripts/build-images.sh with PUSH=true LOGIN=true.

name: Build and push images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.145.0; a leading 'v' is stripped)"
        required: true
        type: string
      ref:
        description: 'Git ref of land-surveyors/abcls to build (branch, tag, SHA). Empty = default branch.'
        required: false
        default: ''
        type: string
      registry:
        description: 'Target container registry'
        required: false
        default: 'abclsacr.azurecr.io'
        type: string
      images:
        description: 'Comma list from: client,api,data-migration'
        required: false
        default: 'client,api,data-migration'
        type: string
      overwrite:
        description: "'true' to rebuild tags that already exist in the registry"
        required: false
        default: false
        type: boolean

env:
  ABCLS_REPO: land-surveyors/abcls

# Same tag+registry builds queue instead of racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.registry }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Resolve source ref
        id: source
        env:
          GH_TOKEN: ${{ secrets.ABCLS_REPO_TOKEN }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "${REF_INPUT}" ]; then
            echo "ref=${REF_INPUT}" >> "$GITHUB_OUTPUT"
            echo "Using explicit ref: ${REF_INPUT}"
          else
            default_branch="$(gh api "repos/${{ env.ABCLS_REPO }}" --jq .default_branch)"
            echo "ref=${default_branch}" >> "$GITHUB_OUTPUT"
            echo "Using default branch: ${default_branch}"
          fi

      - name: Check existing tags
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DOCKER_REGISTRY: ${{ inputs.registry }}
          IMAGES: ${{ inputs.images }}
          OVERWRITE: ${{ inputs.overwrite }}
          REGISTRY_USERNAME: ${{ secrets.AZURE_CLIENT_ID }}
          REGISTRY_PASSWORD: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Mirror the script's normalization (trim; strip one leading 'v'
          # before a digit) so we probe the exact references it would push.
          # Invalid tags/images are NOT rejected here: the probe simply finds
          # nothing and the build script below reports the real error.
          # Fail-closed probing: only manifest-missing errors count as "tag
          # does not exist". Any other probe error aborts the run (unless
          # overwrite=true, which treats it as missing with a warning) so a
          # flaky registry can never silently disarm the guard.
          tag="$(printf '%s' "${TAG_INPUT}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "${tag}" in
            v[0-9]*) tag="${tag#v}" ;;
          esac
          registry="$(printf '%s' "${DOCKER_REGISTRY}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')"
          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
            echo 'error: AZURE_CLIENT_ID / AZURE_CLIENT_SECRET secrets are required to probe the registry.' >&2
            exit 1
          fi
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${registry}" -u "${REGISTRY_USERNAME}" --password-stdin > /dev/null
          existing=''
          existing_count=0
          total=0
          IFS=',' read -r -a parts <<< "${IMAGES}" || true
          for raw in "${parts[@]}"; do
            key="$(printf '%s' "${raw}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "${key}" ] && continue
            total=$((total + 1))
            probe_ref="${registry}/abcls-${key}:${tag}"
            if probe_err="$(docker buildx imagetools inspect "${probe_ref}" 2>&1 >/dev/null)"; then
              existing="${existing}${existing:+,}${key}"
              existing_count=$((existing_count + 1))
            elif printf '%s' "${probe_err}" | grep -qiE 'manifest unknown|no such manifest|not found|not exist'; then
              : # genuinely missing — nothing to record
            elif [ "${OVERWRITE}" = 'true' ]; then
              first_line="$(printf '%s' "${probe_err}" | head -1)"
              echo "::warning::registry probe for '${probe_ref}' failed (${first_line}); overwrite=true, treating as missing."
            else
              echo "error: registry probe failed for '${probe_ref}' — cannot tell whether the tag exists, failing closed:" >&2
              printf '%s\n' "${probe_err}" | head -5 >&2
              exit 1
            fi
          done
          if [ "${total}" -eq 0 ]; then
            echo 'No images selected; leaving validation to the build script.'
            exit 0
          fi
          if [ "${OVERWRITE}" = 'true' ]; then
            if [ "${existing_count}" -gt 0 ]; then
              echo "::warning::overwrite=true: will rebuild existing tag(s): ${existing} (${registry}/abcls-*:${tag})"
            else
              echo "overwrite=true: no existing tags for '${tag}'; proceeding."
            fi
            exit 0
          fi
          if [ "${existing_count}" -eq "${total}" ]; then
            echo "error: all ${total} tag(s) already exist for '${tag}' (${existing}); re-running would overwrite pushed images. Set overwrite=true to force a rebuild." >&2
            exit 1
          fi
          if [ "${existing_count}" -gt 0 ]; then
            echo "::warning::${existing_count}/${total} tag(s) already exist for '${tag}' (${existing}); proceeding (likely a retry after a partial push)."
          else
            echo "No existing tags for '${tag}'; proceeding."
          fi

      - name: Checkout ${{ env.ABCLS_REPO }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ env.ABCLS_REPO }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.ABCLS_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source SHA
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='Built from %H (%s)'

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          DOCKER_REGISTRY: ${{ inputs.registry }}
          IMAGES: ${{ inputs.images }}
          PUSH: 'true'
          LOGIN: 'true'
          REQUIRE_FRONTEND_KEYS: 'true'
          REGISTRY_USERNAME: ${{ secrets.AZURE_CLIENT_ID }}
          REGISTRY_PASSWORD: ${{ secrets.AZURE_CLIENT_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TINYMCE_API_KEY: ${{ secrets.TINYMCE_API_KEY }}
        run: ./scripts/build-images.sh

      - name: Log out of registry
        if: always()
        env:
          DOCKER_REGISTRY: ${{ inputs.registry }}
        run: docker logout "${DOCKER_REGISTRY}" || true

      - name: Write summary
        if: success()
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DOCKER_REGISTRY: ${{ inputs.registry }}
          IMAGES: ${{ inputs.images }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Mirror the script's normalization (trim; strip one leading 'v'
          # before a digit) so the summary shows the real pushed references.
          tag="$(printf '%s' "${TAG_INPUT}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "${tag}" in
            v[0-9]*) tag="${tag#v}" ;;
          esac
          registry="$(printf '%s' "${DOCKER_REGISTRY}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')"
          {
            echo '## Images pushed'
            echo ''
            echo "- Source: \`${{ env.ABCLS_REPO }}@${SOURCE_REF}\` (\`${SOURCE_SHA}\`)"
            echo "- Tag: \`${tag}\`"
            echo ''
            echo '| Image | Reference |'
            echo '| --- | --- |'
            IFS=',' read -r -a parts <<< "${IMAGES}" || true
            for raw in "${parts[@]}"; do
              key="$(printf '%s' "${raw}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "${key}" ] && continue
              echo "| ${key} | \`${registry}/abcls-${key}:${tag}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
